<div class="space-y-4">
  <app-audio-recorder></app-audio-recorder>
  <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-xs space-y-3">
    <div>
      <h2 class="text-sm font-bold text-slate-900">AI concept brief</h2>
      <p class="text-xs text-slate-500">Built from voice notes. Saved on the project, separate from the client notes.</p>
    </div>
    <textarea
      rows="6"
      class="w-full min-h-[44px] rounded-xl border border-slate-300 bg-slate-50 p-3 text-xs"
      [ngModel]="brief()"
      (ngModelChange)="brief.set($event)"
      placeholder="Concept brief appears here after generation. You can edit it."
    ></textarea>
    <button
      type="button"
      (click)="generateBrief()"
      [disabled]="busy()"
      class="min-h-[44px] w-full rounded-xl bg-orange-600 text-xs font-bold text-white cursor-pointer disabled:opacity-60"
    >
      {{ busy() ? 'Writing brief…' : 'Generate concept brief' }}
    </button>
    @if (error()) {
      <p class="rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-xs text-rose-800" role="alert">{{ error() }}</p>
    }
  </section>
</div>
