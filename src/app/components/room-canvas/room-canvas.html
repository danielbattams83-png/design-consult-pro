<div class="flex flex-col h-full bg-white rounded-xl border border-slate-200 overflow-hidden shadow-xs">
  <!-- Blueprint Canvas Toolbar -->
  <div class="flex flex-wrap items-center justify-between gap-2 p-2.5 bg-slate-50 border-b border-slate-200 text-xs font-medium text-slate-700">
    <!-- Tools Row -->
    <div class="flex items-center flex-wrap gap-1">
      <button
        type="button"
        id="tool-select-btn"
        (click)="setTool('select')"
        [class.bg-orange-600]="activeTool() === 'select'"
        [class.text-white]="activeTool() === 'select'"
        [class.bg-white]="activeTool() !== 'select'"
        [class.text-slate-700]="activeTool() !== 'select'"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 hover:border-slate-300 transition-colors shadow-2xs font-semibold cursor-pointer"
      >
        <mat-icon class="text-[18px] w-[18px] h-[18px]">near_me</mat-icon>
        <span>Pointer</span>
      </button>

      <div class="h-5 w-px bg-slate-300 mx-1"></div>

      <!-- Architectural Drop Elements -->
      <button
        type="button"
        id="tool-door-btn"
        (click)="setTool('add_door')"
        [class.bg-orange-600]="activeTool() === 'add_door'"
        [class.text-white]="activeTool() === 'add_door'"
        [class.bg-white]="activeTool() !== 'add_door'"
        [class.text-slate-700]="activeTool() !== 'add_door'"
        class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg border border-slate-200 hover:border-slate-300 transition-colors shadow-2xs cursor-pointer"
        title="Drop Door"
      >
        <mat-icon class="text-[17px] w-[17px] h-[17px]">meeting_room</mat-icon>
        <span>+ Door</span>
      </button>

      <button
        type="button"
        id="tool-window-btn"
        (click)="setTool('add_window')"
        [class.bg-orange-600]="activeTool() === 'add_window'"
        [class.text-white]="activeTool() === 'add_window'"
        [class.bg-white]="activeTool() !== 'add_window'"
        [class.text-slate-700]="activeTool() !== 'add_window'"
        class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg border border-slate-200 hover:border-slate-300 transition-colors shadow-2xs cursor-pointer"
        title="Drop Window"
      >
        <mat-icon class="text-[17px] w-[17px] h-[17px]">window</mat-icon>
        <span>+ Window</span>
      </button>

      <button
        type="button"
        id="tool-outlet-btn"
        (click)="setTool('add_outlet')"
        [class.bg-orange-600]="activeTool() === 'add_outlet'"
        [class.text-white]="activeTool() === 'add_outlet'"
        [class.bg-white]="activeTool() !== 'add_outlet'"
        [class.text-slate-700]="activeTool() !== 'add_outlet'"
        class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg border border-slate-200 hover:border-slate-300 transition-colors shadow-2xs cursor-pointer"
        title="Drop Outlet"
      >
        <mat-icon class="text-[17px] w-[17px] h-[17px]">power</mat-icon>
        <span>+ Outlet</span>
      </button>

      <button
        type="button"
        id="tool-plumbing-btn"
        (click)="setTool('add_plumbing')"
        [class.bg-orange-600]="activeTool() === 'add_plumbing'"
        [class.text-white]="activeTool() === 'add_plumbing'"
        [class.bg-white]="activeTool() !== 'add_plumbing'"
        [class.text-slate-700]="activeTool() !== 'add_plumbing'"
        class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg border border-slate-200 hover:border-slate-300 transition-colors shadow-2xs cursor-pointer"
        title="Drop Plumbing Point"
      >
        <mat-icon class="text-[17px] w-[17px] h-[17px]">water_drop</mat-icon>
        <span>+ Plumbing</span>
      </button>

      <button
        type="button"
        id="tool-column-btn"
        (click)="setTool('add_column')"
        [class.bg-orange-600]="activeTool() === 'add_column'"
        [class.text-white]="activeTool() === 'add_column'"
        [class.bg-white]="activeTool() !== 'add_column'"
        [class.text-slate-700]="activeTool() !== 'add_column'"
        class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg border border-slate-200 hover:border-slate-300 transition-colors shadow-2xs cursor-pointer"
        title="Drop Structural Column"
      >
        <mat-icon class="text-[17px] w-[17px] h-[17px]">view_column</mat-icon>
        <span>+ Column</span>
      </button>
    </div>

    <!-- Right Controls (Templates, Snap, Zoom, Snapshot) -->
    <div class="flex items-center gap-1.5">
      <!-- Templates Dropdown / Buttons -->
      <div class="hidden sm:flex items-center bg-slate-200/70 p-0.5 rounded-lg text-[11px]">
        <button
          type="button"
          (click)="loadRoomTemplate('rect')"
          class="px-2 py-1 rounded hover:bg-white text-slate-700 transition-colors cursor-pointer"
          title="Reset to 4-wall rectangle"
        >
          Rectangle
        </button>
        <button
          type="button"
          (click)="loadRoomTemplate('l_shape')"
          class="px-2 py-1 rounded hover:bg-white text-slate-700 transition-colors cursor-pointer"
          title="Reset to 6-wall L-Shape room"
        >
          L-Shape
        </button>
        <button
          type="button"
          (click)="loadRoomTemplate('galley')"
          class="px-2 py-1 rounded hover:bg-white text-slate-700 transition-colors cursor-pointer"
          title="Reset to Galley layout"
        >
          Galley
        </button>
      </div>

      <div class="h-5 w-px bg-slate-300 mx-0.5"></div>

      <!-- Snap Grid Toggle -->
      <button
        type="button"
        id="snap-grid-btn"
        (click)="toggleSnap()"
        [class.bg-slate-900]="snapToGrid()"
        [class.text-orange-400]="snapToGrid()"
        [class.bg-white]="!snapToGrid()"
        [class.text-slate-500]="!snapToGrid()"
        class="inline-flex items-center gap-1 px-2 py-1.5 rounded-lg border border-slate-200 text-[11px] font-semibold transition-colors cursor-pointer"
        title="Toggle Grid Snapping (6-inch increments)"
      >
        <mat-icon class="text-[16px] w-[16px] h-[16px]">grid_4x4</mat-icon>
        <span class="hidden md:inline">{{ snapToGrid() ? 'Snap 6"' : 'Free' }}</span>
      </button>

      <!-- Zoom In / Out / Fit -->
      <div class="inline-flex items-center rounded-lg border border-slate-200 bg-white shadow-2xs">
        <button
          type="button"
          (click)="zoomOut()"
          class="p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-50 rounded-l-lg cursor-pointer"
          title="Zoom Out"
        >
          <mat-icon class="text-[16px] w-[16px] h-[16px]">remove</mat-icon>
        </button>
        <span class="px-1.5 text-[11px] font-mono-digits text-slate-600 font-semibold">{{ (zoomLevel() * 100).toFixed(0) }}%</span>
        <button
          type="button"
          (click)="zoomIn()"
          class="p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-50 cursor-pointer"
          title="Zoom In"
        >
          <mat-icon class="text-[16px] w-[16px] h-[16px]">add</mat-icon>
        </button>
        <button
          type="button"
          (click)="fitToScreen()"
          class="p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-50 rounded-r-lg border-l border-slate-200 cursor-pointer"
          title="Fit Room to Screen"
        >
          <mat-icon class="text-[16px] w-[16px] h-[16px]">center_focus_strong</mat-icon>
        </button>
      </div>

      <!-- Snapshot PNG Export -->
      <button
        type="button"
        id="export-canvas-snapshot-btn"
        (click)="exportSnapshot()"
        class="inline-flex items-center gap-1 px-2.5 py-1.5 bg-slate-900 text-white rounded-lg hover:bg-slate-800 transition-colors text-xs font-semibold cursor-pointer shadow-2xs"
        title="Save 2D Blueprint PNG to room photos and download"
      >
        <mat-icon class="text-[16px] w-[16px] h-[16px] text-orange-400">camera_alt</mat-icon>
        <span class="hidden sm:inline">Save CAD View</span>
      </button>
    </div>
  </div>

  <!-- Interactive Canvas Viewport -->
  <div #containerEl class="relative flex-1 w-full min-h-[380px] bg-slate-50 select-none overflow-hidden cursor-crosshair">
    <canvas
      #canvasEl
      (mousedown)="onMouseDown($event)"
      (mousemove)="onMouseMove($event)"
      (mouseup)="onMouseUp()"
      (wheel)="onWheel($event)"
      (touchstart)="onTouchStart($event)"
      (touchmove)="onTouchMove($event)"
      (touchend)="onTouchEnd()"
      class="block w-full h-full touch-none"
    ></canvas>

    <!-- Floating Selection Action Bar (when element selected) -->
    @if (selectedShapeId()) {
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-3.5 py-2 rounded-xl shadow-xl flex items-center gap-3 border border-slate-700 animate-in fade-in zoom-in-95 duration-150 z-20">
        <div class="flex items-center gap-1.5 text-xs text-orange-400 font-semibold">
          <mat-icon class="text-[16px] w-[16px] h-[16px]">tune</mat-icon>
          <span>Element Selected</span>
        </div>

        <div class="h-4 w-px bg-slate-700"></div>

        <button
          type="button"
          (click)="rotateSelected()"
          class="inline-flex items-center gap-1 px-2 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded-md transition-colors cursor-pointer"
          title="Rotate 90 degrees"
        >
          <mat-icon class="text-[15px] w-[15px] h-[15px] text-slate-300">rotate_right</mat-icon>
          <span>Rotate 90°</span>
        </button>

        <button
          type="button"
          (click)="deleteSelected()"
          class="inline-flex items-center gap-1 px-2 py-1 bg-rose-950/80 hover:bg-rose-900 text-rose-300 text-xs rounded-md transition-colors cursor-pointer"
          title="Remove element"
        >
          <mat-icon class="text-[15px] w-[15px] h-[15px]">delete</mat-icon>
          <span>Delete</span>
        </button>
      </div>
    }

    <!-- Bottom Left Guide Tooltip -->
    <div class="absolute bottom-3 left-3 bg-white/90 backdrop-blur-xs px-2.5 py-1.5 rounded-lg border border-slate-200 shadow-2xs text-[11px] text-slate-600 hidden sm:flex items-center gap-2 pointer-events-none">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>Drag corner nodes to adjust walls • Click tools above to drop elements • Scroll to zoom</span>
    </div>

    <!-- Active Tool Banner (if adding item) -->
    @if (activeTool() !== 'select') {
      <div class="absolute top-3 left-1/2 -translate-x-1/2 bg-orange-600 text-white px-3.5 py-1.5 rounded-full shadow-md text-xs font-semibold flex items-center gap-2 animate-bounce pointer-events-none">
        <mat-icon class="text-[16px] w-[16px] h-[16px]">touch_app</mat-icon>
        <span>Click on canvas to place {{ activeTool().replace('add_', '') }}</span>
      </div>
    }
  </div>
</div>
