<div class="flex h-[100dvh] flex-col overflow-hidden bg-slate-50 text-slate-900 antialiased font-sans">
  <app-header (openSettings)="isGlobalSettingsOpen.set(true)"></app-header>

  <main class="mx-auto w-full max-w-7xl flex-1 overflow-y-auto p-3 pb-[calc(6.5rem+env(safe-area-inset-bottom))] sm:p-6">
    @switch (activeTab()) {
      @case ('record') {
        <app-record-view></app-record-view>
      }
      @case ('measure') {
        <app-measure-view></app-measure-view>
      }
      @case ('photos') {
        <app-photo-annotator></app-photo-annotator>
      }
      @case ('site') {
        <app-site-brief-view></app-site-brief-view>
      }
    }
  </main>

  <app-recording-bar></app-recording-bar>

  <nav class="no-print fixed inset-x-0 bottom-0 z-40 flex items-stretch justify-around border-t border-slate-800 bg-slate-900/95 px-1 pt-1 text-white shadow-2xl backdrop-blur-md pb-[env(safe-area-inset-bottom)]">
    <button type="button" (click)="setTab('record')" class="min-h-[44px] flex-1 flex flex-col items-center justify-center gap-0.5 cursor-pointer" [class.text-orange-400]="activeTab() === 'record'" [class.text-slate-400]="activeTab() !== 'record'">
      <mat-icon class="text-[20px] w-[20px] h-[20px]">mic</mat-icon>
      <span class="text-[10px] font-bold">Record</span>
    </button>
    <button type="button" (click)="setTab('measure')" class="min-h-[44px] flex-1 flex flex-col items-center justify-center gap-0.5 cursor-pointer" [class.text-orange-400]="activeTab() === 'measure'" [class.text-slate-400]="activeTab() !== 'measure'">
      <mat-icon class="text-[20px] w-[20px] h-[20px]">straighten</mat-icon>
      <span class="text-[10px] font-bold">Measure</span>
    </button>
    <button type="button" (click)="setTab('photos')" class="min-h-[44px] flex-1 flex flex-col items-center justify-center gap-0.5 cursor-pointer" [class.text-orange-400]="activeTab() === 'photos'" [class.text-slate-400]="activeTab() !== 'photos'">
      <mat-icon class="text-[20px] w-[20px] h-[20px]">photo_camera</mat-icon>
      <span class="text-[10px] font-bold">Photos</span>
    </button>
    <button type="button" (click)="setTab('site')" class="min-h-[44px] flex-1 flex flex-col items-center justify-center gap-0.5 cursor-pointer" [class.text-orange-400]="activeTab() === 'site'" [class.text-slate-400]="activeTab() !== 'site'">
      <mat-icon class="text-[20px] w-[20px] h-[20px]">fact_check</mat-icon>
      <span class="text-[10px] font-bold">Site &amp; Brief</span>
    </button>
  </nav>

  @if (isGlobalSettingsOpen()) {
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
      <div class="max-h-[90vh] w-full max-w-md space-y-4 overflow-y-auto rounded-2xl bg-white p-5 text-xs shadow-2xl">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
          <h2 class="text-sm font-bold text-slate-900">Settings / Export</h2>
          <button type="button" (click)="isGlobalSettingsOpen.set(false)" class="flex h-11 w-11 items-center justify-center rounded-full bg-slate-100 cursor-pointer">
            <mat-icon class="text-[18px] w-[18px] h-[18px]">close</mat-icon>
          </button>
        </div>
        @if (auth.currentUser(); as user) {
          <div class="rounded-xl border border-slate-200 bg-slate-50 p-3">
            <div class="font-bold text-slate-900">{{ user.name }}</div>
            <div class="text-[10px] text-slate-500">{{ user.email }}</div>
          </div>
        }
        <div class="grid grid-cols-2 gap-2">
          <button type="button" (click)="store.setUnit('imperial')" class="min-h-[44px] rounded-lg border font-bold cursor-pointer" [class.bg-orange-600]="store.unit() === 'imperial'" [class.text-white]="store.unit() === 'imperial'">ft / in</button>
          <button type="button" (click)="store.setUnit('metric')" class="min-h-[44px] rounded-lg border font-bold cursor-pointer" [class.bg-orange-600]="store.unit() === 'metric'" [class.text-white]="store.unit() === 'metric'">mm / m²</button>
        </div>
        <button type="button" id="export-concept-package" (click)="exportConceptPackage()" class="flex min-h-[44px] w-full items-center justify-center gap-2 rounded-xl bg-orange-600 font-bold text-white cursor-pointer">Export concept package</button>
        <button type="button" (click)="exportData()" class="flex min-h-[44px] w-full items-center justify-center gap-2 rounded-xl border font-bold cursor-pointer">Backup JSON</button>
        @if (exportMessage()) {
          <p class="text-xs text-slate-600">{{ exportMessage() }}</p>
        }
        <button type="button" (click)="resetDemoData()" class="flex min-h-[44px] w-full items-center justify-center gap-2 rounded-xl border font-bold text-amber-700 cursor-pointer">Load Demo Project</button>
      </div>
    </div>
  }
</div>
